<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Classroom Portal" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="portal">
    <aside class="sidebar">
      <div class="brand">{{ brand }}</div>
      <div class="signed">Signed in as<br>{{ current_user.fullname }}</div>
      {% block nav %}{% endblock %}
      <a class="btn btn-gold btn-sm" href="{{ url_for('logout') }}"><span>Log Out</span></a>
    </aside>
    <main class="main">
      {% include "_flashes.html" %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
