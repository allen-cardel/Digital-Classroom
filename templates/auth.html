{% extends "base_auth.html" %}
{% set title = "Sign In | Student Classroom" %}
{% block body %}
<div class="auth-shell">
  <aside class="auth-hero">
    <div class="auth-kicker">Student Classroom</div>
    <h1>Interactive Digital Resources Portal</h1>
    <div class="gold-rule"></div>
  </aside>
  <section class="auth-panel">
    <div class="card auth-card">
      {% include "_flashes.html" %}
      <h2>Welcome back</h2>
      <p class="sub">Sign in to continue to your account.</p>
      <form method="post" action="{{ url_for('login') }}">
        <div class="field">
          <label>Username <span class="muted">name@phinmaed.com</span></label>
          <input name="username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="row">
            <input id="login-pass" type="password" name="password" required>
            <button class="btn btn-ghost btn-sm" type="button" onclick="togglePassword('login-pass', this)"><span>Show</span></button>
          </div>
        </div>
        <button class="btn btn-gold btn-xl" type="submit"><span>Sign In</span></button>
      </form>
      <p><a href="{{ url_for('terms') }}">Terms & Conditions | Privacy</a></p>
    </div>
  </section>
</div>
{% endblock %}
